[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dpdp-rag-audit"
version = "0.1.0"
description = "Automated compliance linter and privacy scanner for RAG knowledge bases under India DPDP Act 2023 and GDPR"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Ashish Dhillon", email = "ashishdhillon.dev@gmail.com" }
]
keywords = [
  "dpdp-act",
  "gdpr",
  "rag",
  "privacy-compliance",
  "pii-redaction",
  "ai-governance",
  "vector-database"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Legal Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security"
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0"
]

[project.scripts]
dpdp-rag-audit = "dpdp_rag_audit.cli:main"

[project.urls]
Homepage = "https://github.com/ashishdhillon/dpdp-rag-audit"
Repository = "https://github.com/ashishdhillon/dpdp-rag-audit"
Issues = "https://github.com/ashishdhillon/dpdp-rag-audit/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
